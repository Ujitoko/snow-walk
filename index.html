<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Yubi-Toko Snow Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone app. A one-line title, then two snowfields side by side: shallow snow over soil on the left, deep snow on the right. */
:root {
  --night: #121a29;
  --ink: #edf2fa;
  --muted: #9babc4;
  --line: #2e3d58;
  --snow: #dfe7f2;
  --soil: #c9c4bb;
  --ember: #f08a3c;
  --veil: rgba(18, 26, 41, 0.8);
  --font-ui: "Lexend", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-ui);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  box-sizing: border-box;
  height: 100%;
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.icon { flex-shrink: 0; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; }
.icon[aria-pressed="false"] { color: var(--muted); }
.icon[aria-pressed="true"] .x, .icon[aria-pressed="false"] .wave { display: none; }
.icon:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.stage { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; border-radius: 18px; overflow: hidden; background: var(--night); }
.pane { position: relative; min-width: 0; min-height: 0; background: var(--snow); }
.pane[data-kind="shallow"] { background: var(--soil); }
.pane canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.pane canvas:active { cursor: grabbing; }
.tag { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 6px 10px; border-radius: 10px; background: var(--veil); font-size: 14px; font-weight: 600; white-space: nowrap; pointer-events: none; }
.pane[data-kind="deep"] .tag { color: var(--ember); }

.hint { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; transition: opacity 0.5s; }
.hint p { margin: 0; max-width: 260px; padding: 12px 18px; border-radius: 12px; background: var(--veil); color: var(--ink); font-size: 15px; line-height: 1.45; text-align: center; }
.hint.gone { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Finger walking on snow</h1>
    <button type="button" class="icon" id="soundBtn" aria-pressed="true" aria-label="Sound">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
        <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/>
        <path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13"/>
        <path class="x" d="M16 9l6 6M22 9l-6 6"/>
      </svg>
    </button>
  </header>
  <main class="stage">
    <div class="pane" data-kind="shallow">
      <canvas aria-label="Shallow snow over hard ground. Drag the ground with your finger to walk."></canvas>
      <div class="tag">Shallow snow</div>
    </div>
    <div class="pane" data-kind="deep">
      <canvas aria-label="Deep snow. Drag the snowfield with your finger to walk."></canvas>
      <div class="tag">Deep snow</div>
    </div>
    <div class="hint" id="hint"><p>Swipe the snow toward you on each side and compare</p></div>
  </main>
</div>

<script>
(() => {
  const hint = document.getElementById("hint");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const TAU = Math.PI * 2;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const DEEP_GAIN = 0.22;        // deep snow: the snowfield moves 22% of the finger's motion
  const SINK_TIME = 0.2;         // seconds for a new footprint to sink in
  const COVER_START = 3;         // seconds after a step when falling snow starts to fill the footprint
  const COVER_END = 5;           // seconds after a step when the footprint is gone
  let clock = 0;

  // ---------- helpers ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(i, j) {
    let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function layer(w, h) {
    const c = document.createElement("canvas");
    c.width = Math.round(w * DPR);
    c.height = Math.round(h * DPR);
    const g = c.getContext("2d");
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return { c, g, w, h };
  }
  const mod = (a, n) => ((a % n) + n) % n;
  const gauss = (rnd) => (rnd() + rnd() + rnd() - 1.5) * 2;   // roughly normal, sd about 1
  function ell(g, x, y, rx, ry, color) {
    g.fillStyle = color;
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill();
  }
  function softEllipse(g, x, y, rx, ry, inner, outer) {
    g.save();
    g.translate(x, y); g.scale(1, ry / rx);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
    gr.addColorStop(0, inner); gr.addColorStop(1, outer);
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill();
    g.restore();
  }

  // ---------- seamless ground tiles, computed pixel by pixel ----------
  const T = 320;                          // tile size in CSS px
  const TDPR = Math.min(DPR, 1.5);        // tile resolution, a little under the screen's to keep start-up quick
  function tiled(fn, x, y, reach) {
    for (const dx of [-T, 0, T]) for (const dy of [-T, 0, T]) {
      const cx = x + dx, cy = y + dy;
      if (cx + reach < 0 || cx - reach > T || cy + reach < 0 || cy - reach > T) continue;
      fn(cx, cy);
    }
  }
  // Smooth noise that wraps at the tile edge: value noise on lattices, summed over octaves. u, v in [0, 1).
  function makeFbm(rnd, base, octaves, gain) {
    const layers = [];
    let P = base, amp = 1, norm = 0;
    for (let o = 0; o < octaves; o++) {
      const g = new Float32Array(P * P);
      for (let i = 0; i < g.length; i++) g[i] = rnd();
      layers.push({ P, amp, g });
      norm += amp; P *= 2; amp *= gain;
    }
    return (u, v) => {
      let s = 0;
      for (const { P, amp, g } of layers) {
        const x = u * P, y = v * P, xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
        const x0 = xi % P, y0 = yi % P, x1 = (x0 + 1) % P, y1 = (y0 + 1) % P;
        const a = g[y0 * P + x0], b = g[y0 * P + x1], c = g[y1 * P + x0], d = g[y1 * P + x1];
        s += amp * (a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy);
      }
      return s / norm;
    };
  }
  const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
  const LIGHT = (() => { const l = [-0.55, -0.65, 0.52], n = Math.hypot(l[0], l[1], l[2]); return l.map((c) => c / n); })();
  // Brightness of a height field lit from the upper left: 1 on flat ground, lower on slopes facing away.
  function shadeMap(H, N, slope) {
    const S = new Float32Array(N * N), flat = LIGHT[2];
    for (let y = 0; y < N; y++) {
      const ym = ((y - 1 + N) % N) * N, yp = ((y + 1) % N) * N, yr = y * N;
      for (let x = 0; x < N; x++) {
        const xm = (x - 1 + N) % N, xp = (x + 1) % N;
        const gx = (H[yr + xp] - H[yr + xm]) * slope, gy = (H[yp + x] - H[ym + x]) * slope;
        S[yr + x] = (-gx * LIGHT[0] - gy * LIGHT[1] + LIGHT[2]) / Math.sqrt(gx * gx + gy * gy + 1) / flat;
      }
    }
    return S;
  }
  function tileCanvas() {
    const N = Math.round(T * TDPR), c = document.createElement("canvas");
    c.width = N; c.height = N;
    return { c, g: c.getContext("2d"), N, d: N / T };
  }

  function paintDeepTile() {
    const t = tileCanvas(), N = t.N, rnd = mulberry32(7);
    const big = makeFbm(rnd, 3, 5, 0.5), fine = makeFbm(rnd, 40, 2, 0.55);
    const H = new Float32Array(N * N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) H[y * N + x] = big(x / N, y / N) + 0.03 * fine(x / N, y / N);
    const S = shadeMap(H, N, N * 0.035);
    const img = t.g.createImageData(N, N), px = img.data;
    for (let i = 0; i < N * N; i++) {
      const lit = smooth(0.45, 1.2, S[i]);       // 0 in shade, 1 in full light
      const low = 0.5 - H[i];                      // hollows sit a little bluer
      const grain = (rnd() - 0.5) * 7;
      let r = 186 + 62 * lit - 14 * low + grain, g = 199 + 51 * lit - 10 * low + grain, b = 224 + 30 * lit + grain;
      if (lit > 0.75 && rnd() < 0.0015) r = g = b = 255;   // ice crystals catching the light
      px[i * 4] = r; px[i * 4 + 1] = g; px[i * 4 + 2] = b; px[i * 4 + 3] = 255;
    }
    t.g.putImageData(img, 0, 0);
    return t;
  }

  function paintShallowTile() {
    // thin, trampled snow with soil worked into it: the soil gathers in the hollows between granules,
    // in streaky patches, with a little bare wet ground where it is dirtiest
    const t = tileCanvas(), N = t.N, rnd = mulberry32(29);
    const dirtField = makeFbm(rnd, 5, 4, 0.55), warpX = makeFbm(rnd, 6, 3, 0.5), warpY = makeFbm(rnd, 6, 3, 0.5);
    const granA = makeFbm(rnd, 36, 2, 0.5), granB = makeFbm(rnd, 96, 1, 0.5), relief = makeFbm(rnd, 4, 3, 0.5), crumb = makeFbm(rnd, 120, 2, 0.6);
    const wrap = (a) => ((a % 1) + 1) % 1;
    const D = new Float32Array(N * N), G = new Float32Array(N * N), H = new Float32Array(N * N), Cr = new Float32Array(N * N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const u = x / N, v = y / N, i = y * N + x;
      D[i] = dirtField(wrap(u + 0.12 * (warpX(u, v) - 0.5)), wrap(v + 0.12 * (warpY(u, v) - 0.5)));
      G[i] = 0.65 * granA(u, v) + 0.35 * granB(u, v);
      H[i] = 0.4 * relief(u, v) + 0.08 * G[i];
      Cr[i] = crumb(u, v);
    }
    const S = shadeMap(H, N, N * 0.04);
    const img = t.g.createImageData(N, N), px = img.data;
    for (let i = 0; i < N * N; i++) {
      const d = D[i], gr = G[i];
      const lit = smooth(0.5, 1.2, S[i]), grain = (rnd() - 0.5) * 8;
      const hollow = smooth(0.55, 0.35, gr);                         // 1 between granules, 0 on top of them
      const a = Math.min(1, smooth(0.38, 0.75, d) * (0.35 + 0.65 * hollow) + 0.08);
      let r = 180 + 58 * lit, g = 179 + 57 * lit, b = 177 + 55 * lit;           // snow
      const mr = 118 + 26 * lit, mg = 100 + 22 * lit, mb = 80 + 18 * lit;      // snow soaked with soil
      r += (mr - r) * a; g += (mg - g) * a; b += (mb - b) * a;
      const bare = smooth(0.7, 0.8, d) * hollow;                               // bare wet soil where it is dirtiest
      r += (82 - r) * bare; g += (68 - g) * bare; b += (52 - b) * bare;
      const c = smooth(0.8 - 0.1 * a, 0.88 - 0.1 * a, Cr[i]);                    // crumbs of soil, soft-edged
      r *= 1 - 0.38 * c; g *= 1 - 0.4 * c; b *= 1 - 0.42 * c;
      if (c < 0.1 && gr > 0.62 && rnd() < 0.02 * lit) { r += 24; g += 24; b += 24; }   // clean granules catching the light
      px[i * 4] = r + grain; px[i * 4 + 1] = g + grain; px[i * 4 + 2] = b + grain; px[i * 4 + 3] = 255;
    }
    t.g.putImageData(img, 0, 0);
    // small stones, only where the soil shows most
    const g = t.g;
    g.setTransform(t.d, 0, 0, t.d, 0, 0);
    let placed = 0;
    for (let k = 0; k < 120 && placed < 10; k++) {
      const x = rnd() * T, y = rnd() * T;
      if (D[Math.floor(y * t.d) * N + Math.floor(x * t.d)] < 0.62) continue;
      placed++;
      const rx = 1.4 + rnd() * 2, ry = rx * (0.6 + rnd() * 0.3);
      tiled((cx, cy) => {
        ell(g, cx + 0.8, cy + 1, rx, ry, "rgba(50,42,34,0.4)");
        ell(g, cx, cy, rx, ry, "rgba(122,116,108,0.95)");
        ell(g, cx - 0.5, cy - 0.6, rx * 0.45, ry * 0.4, "rgba(205,200,192,0.6)");
      }, x, y, rx + 2);
    }
    return t;
  }

  // ---------- small features scattered on the ground ----------
  const tuftSprites = [];       // dry grass poking through thin snow
  for (let s = 0; s < 4; s++) {
    const L = layer(40, 40), g = L.g, rnd = mulberry32(503 + s * 31);
    const n = 4 + Math.floor(rnd() * 5);
    g.lineCap = "round";
    for (let k = 0; k < n; k++) {
      const a = rnd() * TAU, l = 5 + rnd() * 10, bend = (rnd() - 0.5) * 5;
      const ex = 20 + Math.cos(a) * l, ey = 20 + Math.sin(a) * l;
      const mx = 20 + Math.cos(a) * l * 0.5 - Math.sin(a) * bend, my = 20 + Math.sin(a) * l * 0.5 + Math.cos(a) * bend;
      g.lineWidth = 0.9 + rnd() * 0.8;
      g.strokeStyle = "rgba(90,80,70,0.25)";
      g.beginPath(); g.moveTo(22, 22); g.quadraticCurveTo(mx + 2, my + 2, ex + 2, ey + 2); g.stroke();
      g.strokeStyle = "rgba(92,82,64,0.9)";
      g.beginPath(); g.moveTo(20, 20); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
    }
    tuftSprites.push(L);
  }
  const driftSprites = [];      // soft mounds in deep snow
  for (let s = 0; s < 4; s++) {
    const L = layer(100, 70), g = L.g, rnd = mulberry32(811 + s * 13);
    const rx = 26 + rnd() * 16, ry = 12 + rnd() * 8;
    softEllipse(g, 55, 39, rx, ry, "rgba(120,140,185,0.24)", "rgba(120,140,185,0)");
    softEllipse(g, 46, 31, rx * 0.9, ry * 0.9, "rgba(255,255,255,0.6)", "rgba(255,255,255,0)");
    driftSprites.push(L);
  }

  // ---------- footprint sprites: boot prints, toe pointing up, each one a little different ----------
  const SOLE_SEGS = [            // right boot outline as cubic curves, centred on the origin, about 19 x 45 px
    [1, -23, 7, -23, 10, -16, 9.5, -9],
    [9.5, -9, 9, -2, 6.5, 2, 6.5, 7],
    [6.5, 7, 6.5, 12, 7.5, 15, 7, 18],
    [7, 18, 6.5, 23, -6.5, 23, -7, 18],
    [-7, 18, -7.5, 14, -5, 10, -4, 5],
    [-4, 5, -3, 0, -9, -3, -9, -9],
    [-9, -9, -9, -17, -5, -23, 1, -23],
  ];
  const OUTLINE = [];
  for (const [x0, y0, x1, y1, x2, y2, x3, y3] of SOLE_SEGS) {
    for (let k = 0; k < 14; k++) {
      const t = k / 14, u = 1 - t;
      OUTLINE.push([
        u * u * u * x0 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x3,
        u * u * u * y0 + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y3,
      ]);
    }
  }
  // A worn, uneven copy of the outline: points pushed in or out by smooth waves plus grit.
  function roughSole(rnd, amp, grit) {
    const ph = [rnd() * TAU, rnd() * TAU, rnd() * TAU];
    const pts = OUTLINE.map(([x, y]) => {
      const a = Math.atan2(y, x), len = Math.hypot(x, y) || 1;
      const off = amp * (0.5 * Math.sin(3 * a + ph[0]) + 0.3 * Math.sin(7 * a + ph[1]) + 0.2 * Math.sin(13 * a + ph[2])) + grit * (rnd() - 0.5);
      return [x + (x / len) * off, y + (y / len) * off];
    });
    const path = new Path2D();
    pts.forEach(([x, y], k) => (k ? path.lineTo(x, y) : path.moveTo(x, y)));
    path.closePath();
    return { path, pts };
  }
  const LUGS = [];               // chevron lugs under the forefoot, bars under the heel
  for (let y = -20; y <= 0; y += 4) {
    LUGS.push([[-8.5, y + 1.6], [-1, y - 0.6], [-1, y + 1.3], [-8.5, y + 3.5]]);
    LUGS.push([[1, y - 0.6], [8.5, y + 1.6], [8.5, y + 3.5], [1, y + 1.3]]);
  }
  for (let y = 10; y <= 19; y += 4) {
    LUGS.push([[-7.5, y], [-0.8, y], [-0.8, y + 2.1], [-7.5, y + 2.1]]);
    LUGS.push([[0.8, y], [7.5, y], [7.5, y + 2.1], [0.8, y + 2.1]]);
  }
  function drawLugs(g, rnd, rgb, aMin, aMax, skip) {   // in sole coordinates; some lugs faint or missing
    for (const q of LUGS) {
      if (rnd() < skip) continue;
      const jx = (rnd() - 0.5) * 0.8, jy = (rnd() - 0.5) * 0.8;
      g.fillStyle = `rgba(${rgb},${(aMin + rnd() * (aMax - aMin)).toFixed(2)})`;
      g.beginPath();
      q.forEach(([x, y], k) => (k ? g.lineTo(x + jx, y + jy) : g.moveTo(x + jx, y + jy)));
      g.closePath(); g.fill();
    }
  }
  // Run fn in sole coordinates placed at (cx + ox, cy + oy), scaled by s; mirror = -1 for the left boot.
  function inSole(g, cx, cy, ox, oy, s, mirror, fn) {
    g.save();
    g.translate(cx + ox, cy + oy); g.scale(s * mirror, s);
    fn();
    g.restore();
  }
  function clipSole(g, path, cx, cy, s, mirror) {   // caller must g.restore()
    g.save();
    g.translate(cx, cy); g.scale(s * mirror, s);
    g.clip(path);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  // Scatter n bits just outside the outline, up to dist px away.
  function crumbs(rnd, pts, cx, cy, s, mirror, n, dist, draw) {
    for (let k = 0; k < n; k++) {
      const [x, y] = pts[Math.floor(rnd() * pts.length)];
      const len = Math.hypot(x, y) || 1, d = dist * (0.3 + rnd());
      draw(cx + (x + (x / len) * d) * s * mirror, cy + (y + (y / len) * d) * s, 0.6 + rnd() * 1.6);
    }
  }
  function makeShallowPrint(mirror, seed) {
    const L = layer(44, 68), g = L.g, cx = 22, cy = 34, rnd = mulberry32(seed);
    const { path, pts } = roughSole(rnd, 1.0, 0.7);
    // the thin snow is pushed out in crumbs, not in a clean line
    crumbs(rnd, pts, cx, cy, 1, mirror, 54, 2.4, (x, y, r) => ell(g, x, y, r, r * 0.8, `rgba(255,255,255,${(0.55 + rnd() * 0.4).toFixed(2)})`));
    clipSole(g, path, cx, cy, 1, mirror);
    g.fillStyle = "rgba(104,90,76,0.62)";            // shadowed upper-left edge of the shallow dent
    g.fillRect(0, 0, 44, 68);
    inSole(g, cx, cy, 0.9, 1.3, 1, mirror, () => { g.fillStyle = "rgba(146,132,116,0.75)"; g.fill(path); });   // packed snow and mud
    softEllipse(g, cx + mirror, cy - 10, 8, 10, "rgba(110,94,78,0.28)", "rgba(110,94,78,0)");      // ball of the foot presses hardest
    softEllipse(g, cx, cy + 15, 6, 6, "rgba(110,94,78,0.22)", "rgba(110,94,78,0)");                // heel
    softEllipse(g, cx - 5 * mirror, cy + 3, 4, 7, "rgba(213,215,214,0.55)", "rgba(213,215,214,0)"); // the arch barely touches
    inSole(g, cx, cy, 0, 0, 1, mirror, () => drawLugs(g, rnd, "72,56,40", 0.35, 0.85, 0.12));
    for (let k = 0; k < 3; k++) {   // patches where snow stayed in the print

    }

    // touch input
    function localPos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      const p = localPos(e);
      addPrint(p.x + pane.cam.x, p.y + pane.cam.y);
      puff(p.x + pane.cam.x, p.y + pane.cam.y);
      stepSound(kind);
      pane.pointers.set(e.pointerId, { sy: p.y, dy: 0 });
      hint.classList.add("gone");
    });
    canvas.addEventListener("pointermove", (e) => {
      const q = pane.pointers.get(e.pointerId);
      if (!q) return;
      const y = localPos(e).y;
      q.dy += y - q.sy;
      q.sy = y;
    });
    const release = (e) => {
      pane.pointers.delete(e.pointerId);
      if (actx && actx.state === "suspended" && soundOn) actx.resume();   // some phones only unlock audio on release
    };
    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", release);
    canvas.addEventListener("lostpointercapture", release);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    pane.step = (dt) => {
      // Only vertical finger motion moves the ground; the finger that moved most this frame drives it.
      let bm = 0, sdy = 0;
      for (const q of pane.pointers.values()) {
        if (Math.abs(q.dy) > bm) { bm = Math.abs(q.dy); sdy = gain * q.dy; }
        q.dy = 0;
      }
      pane.cam.y -= sdy;
      dragSound(kind, bm, dt);
      pane.cullClock += dt;
      if (pane.cullClock > 2) { pane.cullClock = 0; cullPrints(); }

      const W = pane.W, H = pane.H, cx = pane.cam.x, cy = pane.cam.y;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.save();
      ctx.translate(-mod(cx, P), -mod(cy, P));
      ctx.fillStyle = pattern;
      ctx.fillRect(0, 0, W + P, H + P);
      ctx.restore();

      const i0 = Math.floor((cx - 60) / CELL), i1 = Math.floor((cx + W + 60) / CELL);
      const j0 = Math.floor((cy - 60) / CELL), j1 = Math.floor((cy + H + 60) / CELL);
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const spots = cell(i, j);
        const n = Math.min(spots.length, featureCount);
        for (let k = 0; k < n; k++) {
          const [x, y, v] = spots[k], sp = features[v];
          ctx.drawImage(sp.c, x - cx - sp.w / 2, y - cy - sp.h / 2, sp.w, sp.h);
        }
      }
      drawPrints(cx, cy);
      drawDust(dt, cx, cy);
      drawFlakes(dt, sdy);
      ctx.fillStyle = pane.vignette;
      ctx.fillRect(0, 0, W, H);
    };
    return pane;
  }

  const panes = Array.from(document.querySelectorAll(".pane")).map(makePane);

  const soundBtn = document.getElementById("soundBtn");
  function syncSoundBtn() {
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.setAttribute("aria-label", soundOn ? "Sound on" : "Sound off");
  }
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("yubitoko.sound", soundOn ? "on" : "off"); } catch (e) {}
    if (soundOn) audio();
    else if (actx) actx.suspend();
    syncSoundBtn();
  });
  syncSoundBtn();

  // ---------- main loop ----------
  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now; clock += dt;
    for (const p of panes) p.step(dt);
    requestAnimationFrame(frame);
  }

  function start(data) {
    if (data && Array.isArray(data.panes)) {
      data.panes.forEach((d, k) => {
        if (panes[k] && d) panes[k].cam.y = Number(d.y) || 0;
      });
    }
    requestAnimationFrame(frame);
  }
  try {
    window.claude?.hot?.snapshot?.(() => ({ panes: panes.map((p) => ({ y: p.cam.y })) }));
  } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
